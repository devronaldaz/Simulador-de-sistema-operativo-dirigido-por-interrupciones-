name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pruebas automáticas
        run: python -m unittest discover -s pruebas -t pruebas -v
      - name: Ejemplo E1 de punta a punta
        run: python -m simulador escenarios/e1_tres_procesos_rr4.json --modo resumen
